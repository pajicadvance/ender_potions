# general
mod.id = "modid"
mod.name = "Template mod"
mod.group = "me.pajic"
mod.version = "1.0.0"
mod.description = ""
mod.authors = "pajic"
mod.contributors = ""
mod.license = "MIT"

# links
mod.sources_url = "https://github.com/pajicadvance/modid"
mod.homepage_url = "https://modrinth.com/mod/modid"
mod.issues_url = "https://github.com/pajicadvance/modid/issues"
mod.discord_url = "https://discord.gg/5RkzS66zWb"

# publishing
publish.modrinth = ""
publish.curseforge = ""
publish.env.mr = "CLIENT_AND_SERVER" #https://modmuss50.github.io/mod-publish-plugin/platforms/modrinth/#all-options
publish.env.cf.client = true
publish.env.cf.server = true
publish.dry_run = true

# loom
loomx.loom_version = "1.18-SNAPSHOT"

# dependencies
loader.fabric = "0.19.5"
dep.mixinconstraints.coords = "com.moulberry:$id:$version"
dep.fzzy_config.coords = "me.fzzyhmstrs:$id:$version"
dep.fzzy_config.slug = "fzzy-config"
dep.sodium.coords = "net.caffeinemc:$id-$loader:$version"
include.mixinconstraints = "1.1.0"
dev.runtime_optionals = []

[fabric]
dep.fabric-api.coords = "net.fabricmc.fabric-api:$id:$version"
dep.modmenu.coords = "com.terraformersmc:$id:$version"

[neoforge]


["1.21.1"]
mod.mc_releases = ["1.21", "1.21.1"]
loader.neo = "21.1.264"
dep.mixson.coords = "com.github:Mixson:$version"
include.mixson = "2.2.0"
runtime.sodium = "0.8.13+mc1.21.1"

[fabric."1.21.1"]
mod.mc_compat = ">=1.21 <=1.21.1"
required.fabric-api = "0.116.17+1.21.1"
required.fzzy_config = "0.7.7+1.21"
runtime.modmenu = "11.0.5"

[neoforge."1.21.1"]
mod.mc_compat = "[1.21, 1.21.1]"
required.fzzy_config = "0.7.7+1.21+neoforge"


["26.1"]
mod.mc_releases = ["26.1", "26.1.1", "26.1.2"]
loader.neo = "26.1.2.122"
dep.mixson.coords = "maven.modrinth:$id:$version"
required.mixson = "2.2.0"
runtime.sodium = "0.9.2+mc26.1.2"

[fabric."26.1"]
mod.mc_compat = "~26.1"
required.fabric-api = "0.155.3+26.1.2"
required.fzzy_config = "0.7.7+26.1"
runtime.modmenu = "18.0.2"

[neoforge."26.1"]
mod.mc_compat = "[26.1, 26.2)"
required.fzzy_config = "0.7.7+26.1+neoforge"


["26.2"]
mod.mc_releases = ["26.2"]
loader.neo = "26.2.0.93"
dep.mixson.coords = "maven.modrinth:$id:$version"
required.mixson = "2.2.0"
runtime.sodium = "0.9.2+mc26.2"

[fabric."26.2"]
mod.mc_compat = "~26.2"
required.fabric-api = "0.161.0+26.2"
required.fzzy_config = "0.7.7+26.2"
runtime.modmenu = "20.0.3"

[neoforge."26.2"]
mod.mc_compat = "[26.2, 26.3)"
required.fzzy_config = "0.7.7+26.2+neoforge"


["26.3"]
mod.mc_releases = ["26.3"]
loader.neo = "26.3.0.92"
dep.mixson.coords = "maven.modrinth:$id:$version"
required.mixson = "2.2.1"
runtime.sodium = "0.9.2+mc26.3"

[fabric."26.3"]
mod.mc_compat = "~26.3"
required.fabric-api = "0.163.0+26.3"
required.fzzy_config = "0.7.7+fix3+26.3"
runtime.modmenu = "21.0.0"

[neoforge."26.3"]
mod.mc_compat = "[26.3, 26.4)"
required.fzzy_config = "0.7.7+fix3+26.3+neoforge"
