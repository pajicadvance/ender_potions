# general
mod.id = "ender_potions"
mod.name = "Ender Potions"
mod.group = "me.pajic"
mod.version = "2.0.0"
mod.description = "Teleport to your friends (and all over the place?) with two new potions"
mod.authors = "pajic"
mod.contributors = "Lufurrius"
mod.license = "MIT"

# links
mod.sources_url = "https://github.com/pajicadvance/ender_potions"
mod.homepage_url = "https://modrinth.com/mod/ender-potions"
mod.issues_url = "https://github.com/pajicadvance/ender_potions/issues"
mod.discord_url = "https://discord.gg/5RkzS66zWb"

# publishing
publish.modrinth = "i1OXfCg4"
publish.curseforge = "1188554"
publish.env.mr = "CLIENT_AND_SERVER" #https://modmuss50.github.io/mod-publish-plugin/platforms/modrinth/#all-options
publish.env.cf.client = true
publish.env.cf.server = true
publish.dry_run = false

# loom
loomx.loom_version = "1.18-SNAPSHOT"

# dependencies
loader.fabric = "0.19.5"
dep.sodium.coords = "net.caffeinemc:$id-$loader:$version"
dep.jei.coords = "mezz.jei:jei-$mc-$loader:$version"
dep.rei.coords = "me.shedaniel:RoughlyEnoughItems-$loader:$version"
dep.rei.id = "roughlyenoughitems"
dep.emi.coords = "dev.emi:emi-$loader:$version"
dep.rrv.coords = "maven.modrinth:$id:$version-$loader"
dev.runtime_optionals = []

[fabric]
dep.fabric-api.coords = "net.fabricmc.fabric-api:$id:$version"

[neoforge]


["1.21.1"]
